[project]
name = "recall-ai-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "QuangMinhNguyen27405",email = "quangminh27405@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langchain (>=1.2.13,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "boto3 (>=1.42.78,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlmodel (>=0.0.37,<0.0.38)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "opensearch-py (>=3.1.0,<4.0.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
]

[tool.poetry]
packages = [{include = "app", from = "src"}]

[tool.poetry.scripts]
start = "app.main:start"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "boto3-stubs (>=1.42.78,<2.0.0)",
    "unstructured (>=0.22.16,<0.23.0)"

]
